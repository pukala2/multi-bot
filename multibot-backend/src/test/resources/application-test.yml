spring:
  ai:
    anthropic:
      api-key: test-anthropic-key
    openai:
      api-key: test-openai-key

management:
  endpoint:
    health:
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

multibot:
  tenancy:
    mode: mock
  security:
    login:
      max-per-minute: 100000      # throttling praktycznie wyłączony, by nie psuć innych ITów
  cors:
    allowed-origins: http://localhost:5173

server:
  tomcat:
    accesslog:
      enabled: false

logging:
  level:
    root: WARN
    com.multibot: INFO
