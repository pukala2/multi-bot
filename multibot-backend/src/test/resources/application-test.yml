spring:
  ai:
    anthropic:
      api-key: test-anthropic-key
    openai:
      api-key: test-openai-key

management:
  endpoint:
    health:
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

multibot:
  tenancy:
    mode: mock

server:
  tomcat:
    accesslog:
      enabled: false

logging:
  level:
    root: WARN
    com.multibot: INFO
