# =============================================================================
# Profile: dev (local development)
# =============================================================================

spring:
  jpa:
    show-sql: true                 # czytelne SQL w konsoli
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    org.hibernate.SQL: DEBUG
    # Spring Modulith - logi eventów
    org.springframework.modulith: DEBUG

# Swagger UI dostępne tylko w dev
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
