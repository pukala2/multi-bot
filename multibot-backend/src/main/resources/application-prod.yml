# =============================================================================
# Profile: prod (serwer)
# Wartosci wrazliwe (DB, klucze API, sekrety) przychodza z env vars (docker-compose).
# Bazowy application.yml juz czyta env: DB_URL/USER/PASSWORD, ANTHROPIC/OPENAI key,
# bootstrap.*, security.rate-limit.*, turnstile.* — tu tylko nadpisania prod.
# =============================================================================

spring:
  jpa:
    show-sql: false

server:
  # Caddy terminuje TLS i ustawia X-Forwarded-*; framework => request.isSecure()=true za proxy,
  # dzięki czemu cookies sesji/XSRF lecą jako Secure i Spring Security emituje HSTS.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax
        http-only: true

multibot:
  # Origin panelu (CORS z cookie). Override przez MULTIBOT_CORS_ALLOWED_ORIGINS w deploy/.env.
  cors:
    allowed-origins: ${MULTIBOT_CORS_ALLOWED_ORIGINS:https://multibot-test.duckdns.org}

# Swagger / API docs wylaczone na produkcji (publiczny serwer)
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: INFO
    com.multibot: INFO              # mniej gadatliwie niz dev (tam DEBUG)
    org.hibernate.SQL: WARN
