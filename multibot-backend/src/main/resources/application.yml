# =============================================================================
# Multibot - default configuration (wspólne dla wszystkich profili)
# Profile-specific config: application-dev.yml, application-test.yml, application-prod.yml
# =============================================================================

spring:
  application:
    name: multibot

  profiles:
    default: dev

  # ----- DataSource (PostgreSQL) -----
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/multibot}
    username: ${DB_USER:multibot}
    password: ${DB_PASSWORD:multibot}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # ----- JPA / Hibernate -----
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway zarządza schematem
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  # ----- Flyway -----
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/tenant
      - classpath:db/migration/file
      - classpath:db/migration/vector
      - classpath:db/migration/document
      - classpath:db/migration/indexing
      - classpath:db/migration/chat

  # ----- Multipart (upload plików) -----
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ----- Spring Modulith -----
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false

  # ----- Spring AI -----
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          temperature: 0.2
          max-tokens: 1024
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: false   # mamy własną tabelę chunks przez Flyway

  # OpenAI chat wyłączony - używamy tylko embeddingów (chat to Anthropic)
  autoconfigure:
    exclude: org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration

# =============================================================================
# Multibot - custom properties
# =============================================================================

multibot:

  tenancy:
    mode: mock                     # mock | jwt | header

  file:
    storage:
      mode: local                  # local | s3
      local:
        base-path: ./storage

  chat:
    memory:
      window-size: 10              # ostatnich N wiadomości w prompcie

  rag:
    top-k: 5                       # liczba chunków do retrieve
    candidate-multiplier: 10       # mnożnik LIMIT (pre-filter workaround dla HNSW)
    min-score: 0.7                 # filtr similarity (cosine)

  indexing:
    chunking:
      chunk-size: 500
      overlap: 50
    embedding:
      batch-size: 1                # post-MVP: zwiększyć dla wydajności
    retry:
      max-attempts: 3
      backoff-ms: 1000

  async:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 100

# =============================================================================
# Server + Actuator
# =============================================================================

server:
  port: 8080
  tomcat:
    accesslog:
      enabled: true
      pattern: '%t %a "%r" %s %b %D'

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# =============================================================================
# SpringDoc / Swagger UI
# =============================================================================

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# =============================================================================
# Logging
# =============================================================================

logging:
  level:
    root: INFO
    com.multibot: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{tenantId:-}] [%X{requestId:-}] %-5level %logger{36} - %msg%n"
