openapi: 3.1.0

info:
  title: Multibot API
  version: 1.0.0
  description: |
    REST API platformy Multibot - SaaS B2B do zarządzania chatbotami AI z RAG.

    Dokumentacja human-readable: `endpoints.md`.
  contact:
    name: Multibot Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.multibot.app
    description: Production (post-MVP)

tags:
  - name: Documents
    description: Upload, listowanie, usuwanie dokumentów + monitorowanie statusu indeksacji.
  - name: Chat
    description: Sesje chatu, historia wiadomości, wysyłanie wiadomości z SSE streamingiem.
  - name: Auth
    description: Logowanie/wylogowanie (sesje cookie), bieżący użytkownik, przełączanie aktywnego bota.
  - name: Bots
    description: Self-serve zarządzanie botami przez OWNERa (limit per plan egzekwowany serwerowo).
  - name: SuperAdmin
    description: Provisioning organizacji i botów przez SUPER_ADMINa (omija limit botów).
  - name: Billing
    description: Plan i zużycie wiadomości aktualnego bota (liczby user-friendly, bez tokenów/kosztów).
  - name: WidgetOrigins
    description: Dozwolone domeny widgetu aktywnego bota (allowed_origins).
  - name: WidgetIcon
    description: Własna ikonka bota (upload/usuń w panelu, publiczne serwowanie po kluczu).
  - name: Turnstile
    description: Publiczna konfiguracja anty-bota (Cloudflare Turnstile) dla widgetu.

# ============================================================
# PATHS
# ============================================================
paths:

  # ----- Documents -----

  /api/documents:

    get:
      tags: [Documents]
      operationId: listDocuments
      summary: Lista dokumentów tenanta
      description: Zwraca paginowaną listę dokumentów z możliwością sortowania.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: versionId
          in: query
          required: false
          description: Filtruj po wersji bota (jeśli puste — wszystkie tenanta)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista dokumentów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: Upload nowego dokumentu
      description: |
        Upload pliku PDF/DOCX/TXT/MD. Po zapisie wyzwala asynchroniczną indeksację.
        Response zawiera dokument ze statusem `PENDING`. Klient może pollować
        `GET /api/documents/{id}/status` lub polegać na finalnym statusie `READY`.
      parameters:
        - name: versionId
          in: query
          required: false
          description: Wgraj do konkretnej wersji bota (jeśli puste — aktywna wersja)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    Plik dokumentu. Max 50MB. Akceptowane rozszerzenia:
                    `.pdf`, `.docx`, `.txt`, `.md`.

                    Walidacja po stronie serwera odrzuca nieobsługiwane formaty
                    z kodem 400 i `code=VALIDATION_FAILED`.
                filename:
                  type: string
                  description: Opcjonalna nazwa pliku (jeśli inna niż oryginalna)
                  example: "OWU 2025 - PZU.pdf"
              required: [file]
      responses:
        '202':
          description: Dokument przyjęty, indeksacja w tle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
          headers:
            Location:
              schema:
                type: string
              description: URL nowego dokumentu
              example: "/api/documents/01918a3f-9c1e-7c40-8000-000000000001"
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/documents/{id}:

    get:
      tags: [Documents]
      operationId: getDocument
      summary: Pobierz dokument
      description: Pełne metadane dokumentu (bez zawartości pliku).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dokument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Usuń dokument
      description: |
        Kaskadowe usunięcie: dokument + chunki w pgvector + plik z storage.
        Operacja synchroniczna - po response zasób nie istnieje.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Dokument usunięty
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/documents/{id}/status:

    get:
      tags: [Documents]
      operationId: getDocumentStatus
      summary: Lekki endpoint statusu (dla pollowania z FE)
      description: |
        Zwraca tylko status i timestamps. Zoptymalizowany do częstego pollowania
        z frontendu w trakcie indeksacji.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status dokumentu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ----- Chat -----

  /api/chat/sessions:

    get:
      tags: [Chat]
      operationId: listChatSessions
      summary: Lista sesji chatu tenanta
      description: |
        Paginowana lista sesji. Dla admina - pozwala przeglądać historię rozmów.
        Sortowanie domyślne: `lastActivityAt,desc`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Lista sesji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Chat]
      operationId: startChatSession
      summary: Utworzenie nowej sesji chatu
      description: |
        Tworzy nową sesję dla end usera. End user jest anonymous (zawsze `anonymousId`),
        opcjonalnie z `externalId` (jeśli klient identyfikuje swoich userów).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionRequest'
      responses:
        '201':
          description: Sesja utworzona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
          headers:
            Location:
              schema:
                type: string
              description: URL nowej sesji
              example: "/api/chat/sessions/01918a3f-9c1e-7c40-8000-000000000001"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/chat/sessions/{id}/messages:

    get:
      tags: [Chat]
      operationId: getSessionHistory
      summary: Historia wiadomości w sesji
      description: |
        Paginowana lista wiadomości w sesji.
        Sortowanie domyślne: `createdAt,asc` (kolejność chronologiczna).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Historia wiadomości
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Chat]
      operationId: sendMessage
      summary: Wyślij wiadomość - response w formie SSE stream
      description: |
        Endpoint wysyłający wiadomość użytkownika i zwracający odpowiedź bota
        w formie **Server-Sent Events (SSE)** streamu.

        Format strumienia:
        ```
        event: chunk
        data: {"text": "część odpowiedzi..."}

        event: chunk
        data: {"text": "kolejna część..."}

        event: sources
        data: {"sources": [{"chunkId": "...", "documentId": "...", "snippet": "...", "score": 0.85}]}

        event: done
        data: {"messageId": "uuid", "tokensUsed": 1234}
        ```

        Typy eventów:
        - `chunk` - kolejny fragment tekstu odpowiedzi (delta)
        - `sources` - lista cytatów z dokumentów źródłowych (emitowane na końcu, przed `done`)
        - `done` - koniec strumienia, finalne ID wiadomości i statystyki

        Klient powinien parsować SSE używając EventSource API (browser) lub
        odpowiedniego klienta SSE.

        Schemy event payloadów: zobacz `MessageChunkEvent`, `MessageSourcesEvent`, `MessageDoneEvent`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: versionId
          in: query
          required: false
          description: |
            Override aktywnej wersji bota (do testowego czatu w admin panel).
            Bot użyje dokumentów z tej wersji zamiast aktywnej.
            End-userzy (widget) nie powinni przekazywać tego parametru.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: |
            Odpowiedź bota - blocking JSON `MessageResponse`.

            **Streaming SSE:** ten sam endpoint `POST /api/chat/sessions/{id}/messages`
            obsługuje także `Accept: text/event-stream` i wtedy zwraca stream z eventami
            `chunk`, `sources`, `done` (impl: osobny handler w controllerze poza OpenAPI spec).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/widget:
    get:
      tags:
        - WidgetAdmin
      summary: Pobierz konfigurację widgetu (operator)
      description: Zwraca publishable key + settings widgetu dla aktualnego tenanta.
      operationId: getWidgetAdminConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetAdminConfigResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - WidgetAdmin
      summary: Zaktualizuj settings widgetu
      operationId: updateWidgetSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetSettingsRequest'
      responses:
        '200':
          description: Zapisane
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/widget/config:
    get:
      tags:
        - Widget
      summary: Publiczna konfiguracja widgetu po kluczu
      description: Endpoint wywoływany przez widget na stronie klienta przy pierwszym ładowaniu.
      operationId: getWidgetPublicConfig
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          example: pk_widget_live_a1b2c3d4
      responses:
        '200':
          description: Settings widgetu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetSettingsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/versions:
    get:
      tags:
        - BotVersions
      summary: Lista wszystkich wersji bota dla tenanta
      operationId: listVersions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatbotVersionResponse'
    post:
      tags:
        - BotVersions
      summary: Utwórz nową wersję (opcjonalnie kopiuj dokumenty z innej)
      operationId: createVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
      responses:
        '201':
          description: Utworzona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/versions/active:
    get:
      tags:
        - BotVersions
      summary: Pobierz aktywną wersję
      operationId: getActiveVersion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotVersionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/versions/{id}:
    delete:
      tags:
        - BotVersions
      summary: Usuń wersję (nie aktywną)
      operationId: deleteVersion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Usunięta
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/versions/{id}/activate:
    post:
      tags:
        - BotVersions
      summary: Aktywuj wersję (poprzednia aktywna -> ARCHIVED)
      operationId: activateVersion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotVersionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/rag-settings:
    get:
      tags:
        - RagSettings
      summary: Pobierz ustawienia RAG dla tenanta
      description: Zwraca aktualne ustawienia (lub defaulty jeśli tenant nigdy nie zapisał).
      operationId: getRagSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagSettingsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - RagSettings
      summary: Zapisz ustawienia RAG
      operationId: updateRagSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagSettingsRequest'
      responses:
        '200':
          description: Zapisane
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/admin/analytics:
    get:
      tags:
        - Analytics
      summary: Pełne dane analityki dla tenanta
      description: |
        Zwraca komplet metryk dla wybranego okresu: overview KPI, engagement,
        wykresy dzienne, heatmap godzin, top pytania, aktywność wersji,
        najdłuższe sesje. Jedno zapytanie zwraca cały dashboard analityki.
      operationId: getAnalytics
      parameters:
        - name: period
          in: query
          required: false
          description: Okres analizy
          schema:
            type: string
            enum: [D1, D7, D30, D90]
            default: D7
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSnapshotResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/stats:
    get:
      tags:
        - Admin
      summary: Statystyki tenanta dla dashboardu
      description: |
        Zwraca zagregowane metryki: liczba dokumentów (z breakdownem statusów),
        sesji (total/today/week), wiadomości (total/today) i tokenów (total/today + szacowany koszt).
      operationId: getAdminStats
      responses:
        '200':
          description: Statystyki
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ----- Auth (ręczne kontrolery, sesje cookie) -----

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Logowanie (ustawia sesję cookie + XSRF-TOKEN)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Zalogowano — zwraca bieżącego użytkownika
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Wylogowanie (czyści sesję)
      operationId: logout
      responses:
        '204':
          description: Wylogowano

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Bieżący użytkownik + organizacja + aktywny bot + lista botów
      operationId: getCurrentUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/active-bot:
    post:
      tags:
        - Auth
      summary: Przełącz aktywnego bota (waliduje że bot należy do organizacji usera)
      operationId: switchActiveBot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveBotRequest'
      responses:
        '200':
          description: Przełączono — zwraca aktywnego bota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----- Bots (self-serve OWNER) -----

  /api/bots/limit:
    get:
      tags:
        - Bots
      summary: Bieżący limit botów organizacji
      operationId: getBotLimit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotLimitResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/bots:
    post:
      tags:
        - Bots
      summary: Dodaj bota (egzekwuje max_bots planu → 409)
      operationId: addOwnerBot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBotRequest'
      responses:
        '201':
          description: Utworzono bota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddBotResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  # ----- Super Admin (provisioning) -----

  /api/super-admin/organizations:
    get:
      tags:
        - SuperAdmin
      summary: Lista wszystkich organizacji (z botami i zużyciem)
      operationId: listOrganizations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationRow'
    post:
      tags:
        - SuperAdmin
      summary: Utwórz organizację + ownera + pierwszego bota
      description: Zwraca RAZ hasło ownera i klucz widgetu — nie da się ich odzyskać później.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Utworzono organizację
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/super-admin/organizations/{orgId}/bots:
    post:
      tags:
        - SuperAdmin
      summary: Dodaj bota do organizacji (omija limit planu)
      operationId: addBotToOrganization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBotRequest'
      responses:
        '201':
          description: Utworzono bota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddBotResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----- Billing (admin klienta) -----

  /api/admin/billing/usage:
    get:
      tags:
        - Billing
      summary: Zużycie wiadomości aktualnego bota (pooled per organizacja)
      operationId: getBillingUsage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsageResponse'

  /api/admin/billing/plan:
    get:
      tags:
        - Billing
      summary: Plan aktualnego bota
      operationId: getBillingPlan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlanResponse'

  # ----- Widget origins (dozwolone domeny aktywnego bota) -----

  /api/admin/widget/origins:
    get:
      tags:
        - WidgetOrigins
      summary: Pobierz dozwolone domeny widgetu
      operationId: getWidgetOrigins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetOriginsResponse'
    put:
      tags:
        - WidgetOrigins
      summary: Zapisz dozwolone domeny widgetu (URL → origin normalizacja serwerowa)
      operationId: updateWidgetOrigins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetOriginsRequest'
      responses:
        '200':
          description: Zapisane (znormalizowane)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetOriginsResponse'

  # ----- Ikonka widgetu (własny obrazek bota) -----

  /api/admin/widget/icon:
    post:
      tags:
        - WidgetIcon
      summary: Wgraj własną ikonkę bota (PNG/JPG/WebP, max 512 KB)
      description: |
        Obrazek pokazywany jako launcher i avatar bota. Walidacja po magic-bytes,
        SVG odrzucone (bezpieczeństwo). Zastępuje poprzednią ikonkę.
      operationId: uploadWidgetIcon
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Obrazek PNG/JPG/WebP, max 512 KB.
              required: [file]
      responses:
        '200':
          description: Ikonka zapisana
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags:
        - WidgetIcon
      summary: Usuń własną ikonkę (powrót do domyślnej)
      operationId: deleteWidgetIcon
      responses:
        '200':
          description: Usunięto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetSettingsResponse'

  /api/widget/icon/{key}:
    get:
      tags:
        - WidgetIcon
      summary: Publiczny obrazek ikonki bota po kluczu widgetu
      operationId: getWidgetIcon
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Obrazek
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # ----- Turnstile (publiczna konfiguracja anty-bota) -----

  /api/widget/turnstile:
    get:
      tags:
        - Turnstile
      summary: Czy Turnstile jest włączony i jaki sitekey załadować
      operationId: getTurnstileConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnstileConfigResponse'

# ============================================================
# COMPONENTS
# ============================================================
components:

  # ----- Schemas -----
  schemas:

    # === Shared (common) ===

    ProblemDetail:
      type: object
      description: |
        RFC 7807 Problem Details - jednolity format błędów dla wszystkich response'ów 4xx i 5xx.
      properties:
        type:
          type: string
          format: uri
          description: URI identyfikujący typ problemu
          example: "https://multibot.app/errors/document-not-found"
        title:
          type: string
          description: Krótki, human-readable tytuł problemu
          example: "Document Not Found"
        status:
          type: integer
          description: HTTP status code
          example: 404
        detail:
          type: string
          description: Szczegóły specyficzne dla tego wystąpienia
          example: "Document with id 01918a3f-9c1e-7c40-8000-000000000001 not found"
        instance:
          type: string
          description: URI ścieżki która zwróciła błąd
          example: "/api/documents/01918a3f-9c1e-7c40-8000-000000000001"
        code:
          type: string
          description: Machine-readable kod błędu
          example: "DOCUMENT_NOT_FOUND"
        tenantId:
          type: string
          format: uuid
          description: ID tenanta requestu (do debugowania)
        traceId:
          type: string
          description: ID trace dla distributed tracing
        timestamp:
          type: string
          format: date-time
          description: Czas wystąpienia błędu (ISO 8601)
      required:
        - type
        - title
        - status

    ValidationErrorDetail:
      type: object
      description: Pojedynczy błąd walidacji pola
      properties:
        field:
          type: string
          example: "filename"
        message:
          type: string
          example: "must not be blank"
        rejectedValue:
          description: Wartość która została odrzucona (jeśli safe to log)
          example: ""
      required:
        - field
        - message

    ValidationProblemDetail:
      description: ProblemDetail rozszerzony o listę błędów walidacji (response 400)
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/ValidationErrorDetail'
          required:
            - errors

    # === Auth ===

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          example: owner@demo.local
        password:
          type: string
          example: "Demo!Owner2026"
      required:
        - email
        - password

    BotSummary:
      type: object
      description: Skrócona reprezentacja bota (przełącznik, listy).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    MeResponse:
      type: object
      description: Bieżący użytkownik z kontekstem organizacji i aktywnego bota.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [SUPER_ADMIN, OWNER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED, MUST_CHANGE_PASSWORD]
        organizationId:
          type: string
          format: uuid
          nullable: true
          description: NULL dla SUPER_ADMINa.
        lastLoginAt:
          type: string
          nullable: true
          description: ISO 8601 (instant). NULL gdy nigdy nie logowano.
        activeBot:
          allOf:
            - $ref: '#/components/schemas/BotSummary'
          nullable: true
        bots:
          type: array
          items:
            $ref: '#/components/schemas/BotSummary'
      required:
        - id
        - email
        - role
        - status
        - bots

    ActiveBotRequest:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
      required:
        - tenantId

    # === Bots (self-serve) ===

    BotLimitResponse:
      type: object
      properties:
        allowed:
          type: boolean
          description: Czy można dodać kolejnego bota.
        currentBots:
          type: integer
          format: int32
        maxBots:
          type: integer
          format: int32
          description: -1 = bez limitu.
        unlimited:
          type: boolean
      required:
        - allowed
        - currentBots
        - maxBots
        - unlimited

    AddBotRequest:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          nullable: true
          description: Adres strony (→ origin) dozwolonej domeny widgetu.
      required:
        - name

    AddBotResponse:
      type: object
      description: Zawiera klucz widgetu pokazywany RAZ.
      properties:
        botId:
          type: string
          format: uuid
        botName:
          type: string
        widgetKey:
          type: string
      required:
        - botId
        - botName
        - widgetKey

    # === Super Admin ===

    OrganizationBotRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        userMessages:
          type: integer
          format: int64
      required:
        - id
        - name
        - slug
        - userMessages

    OrganizationRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
        status:
          type: string
        companyName:
          type: string
          nullable: true
        nip:
          type: string
          nullable: true
        userMessages:
          type: integer
          format: int64
          description: Pooled — suma wiadomości wszystkich botów organizacji.
        effectiveLimit:
          type: integer
          format: int32
          description: -1 = bez limitu.
        bots:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationBotRow'
        createdAt:
          type: string
          description: ISO 8601 (instant).
      required:
        - id
        - name
        - slug
        - plan
        - status
        - userMessages
        - effectiveLimit
        - bots
        - createdAt

    CreateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
        ownerEmail:
          type: string
          format: email
        plan:
          type: string
          example: FREE
        companyName:
          type: string
          nullable: true
        nip:
          type: string
          nullable: true
        firstBotName:
          type: string
          nullable: true
        firstBotUrl:
          type: string
          nullable: true
      required:
        - name
        - ownerEmail
        - plan

    ProvisionResponse:
      type: object
      description: Dane provisioningu — hasło i klucz widgetu pokazywane RAZ.
      properties:
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        ownerEmail:
          type: string
        generatedPassword:
          type: string
        firstBotId:
          type: string
          format: uuid
        firstBotName:
          type: string
        widgetKey:
          type: string
      required:
        - organizationId
        - organizationName
        - ownerEmail
        - generatedPassword
        - firstBotId
        - firstBotName
        - widgetKey

    # === Billing ===

    BillingUsageResponse:
      type: object
      properties:
        plan:
          type: string
        planName:
          type: string
        monthlyMessagesLimit:
          type: integer
          format: int32
        effectiveLimit:
          type: integer
          format: int32
        userMessages:
          type: integer
          format: int64
        aiMessages:
          type: integer
          format: int64
        periodMonth:
          type: string
          description: Data początku okresu rozliczeniowego (ISO YYYY-MM-DD, pierwszy dzień miesiąca).
        resetsAt:
          type: string
          description: ISO 8601 — początek następnego miesiąca.
        remainingDays:
          type: integer
          format: int64
        percentUsed:
          type: number
          format: double
        unlimited:
          type: boolean
      required:
        - plan
        - planName
        - monthlyMessagesLimit
        - effectiveLimit
        - userMessages
        - aiMessages
        - periodMonth
        - resetsAt
        - remainingDays
        - percentUsed
        - unlimited

    BillingPlanResponse:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        monthlyMessagesLimit:
          type: integer
          format: int32
        effectiveLimit:
          type: integer
          format: int32
        maxBots:
          type: integer
          format: int32
          nullable: true
          description: NULL = bez limitu botów.
        customDomainAllowed:
          type: boolean
        apiAccessAllowed:
          type: boolean
        pricePlnMonthly:
          type: integer
          format: int32
          nullable: true
          description: Cena miesięczna w PLN (całe złote). NULL = custom pricing.
      required:
        - code
        - name
        - monthlyMessagesLimit
        - effectiveLimit
        - customDomainAllowed
        - apiAccessAllowed

    # === Widget origins ===

    WidgetOriginsRequest:
      type: object
      properties:
        origins:
          type: array
          items:
            type: string
          description: Lista URLi/originów; serwer normalizuje do origin. Pusta = działa wszędzie.
      required:
        - origins

    WidgetOriginsResponse:
      type: object
      properties:
        origins:
          type: array
          items:
            type: string
      required:
        - origins

    # === Turnstile ===

    TurnstileConfigResponse:
      type: object
      properties:
        enabled:
          type: boolean
        siteKey:
          type: string
      required:
        - enabled
        - siteKey

    IdResponse:
      type: object
      description: Response zawierający tylko ID utworzonego zasobu
      properties:
        id:
          type: string
          format: uuid
          example: "01918a3f-9c1e-7c40-8000-000000000001"
      required:
        - id

    PageMetadata:
      type: object
      description: Metadane paginacji w response
      properties:
        page:
          type: integer
          description: Numer aktualnej strony (0-based)
          example: 0
        size:
          type: integer
          description: Rozmiar strony
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Całkowita liczba elementów
          example: 42
        totalPages:
          type: integer
          description: Całkowita liczba stron
          example: 3
        first:
          type: boolean
          description: Czy to pierwsza strona
        last:
          type: boolean
          description: Czy to ostatnia strona
      required:
        - page
        - size
        - totalElements
        - totalPages
        - first
        - last

    # === Documents ===

    DocumentStatus:
      type: string
      enum: [PENDING, PROCESSING, READY, FAILED]
      description: |
        Stan indeksacji dokumentu:
        - PENDING: właśnie uploadowany, czeka na indeksację
        - PROCESSING: indeksacja w toku
        - READY: zaindeksowany, gotowy do RAG
        - FAILED: indeksacja nie powiodła się

    DocumentResponse:
      type: object
      description: Pełne metadane dokumentu
      properties:
        id:
          type: string
          format: uuid
          example: "01918a3f-9c1e-7c40-8000-000000000001"
        filename:
          type: string
          example: "owu-pzu-2025.pdf"
        mimeType:
          type: string
          example: "application/pdf"
        sizeBytes:
          type: integer
          format: int64
          example: 2048576
        status:
          $ref: '#/components/schemas/DocumentStatus'
        uploadedAt:
          type: string
          format: date-time
          example: "2025-05-22T08:15:30Z"
        indexedAt:
          type: string
          format: date-time
          nullable: true
          description: NULL dopóki nie ukończono indeksacji
          example: "2025-05-22T08:16:45Z"
        errorMessage:
          type: string
          nullable: true
          description: Wypełnione tylko gdy status=FAILED
      required:
        - id
        - filename
        - mimeType
        - sizeBytes
        - status
        - uploadedAt

    DocumentSummary:
      type: object
      description: Lekka wersja dokumentu dla listy (bez pól mogących być długie)
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/DocumentStatus'
        uploadedAt:
          type: string
          format: date-time
      required:
        - id
        - filename
        - mimeType
        - sizeBytes
        - status
        - uploadedAt

    DocumentStatusResponse:
      type: object
      description: Lekki response dla endpointu /status
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DocumentStatus'
        indexedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
      required:
        - id
        - status

    PaginatedDocumentResponse:
      type: object
      description: Strona dokumentów z metadanymi paginacji
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
        pagination:
          $ref: '#/components/schemas/PageMetadata'
      required:
        - content
        - pagination

    # === Chat ===

    MessageRole:
      type: string
      enum: [USER, ASSISTANT, SYSTEM]
      description: |
        Rola wiadomości w konwersacji:
        - USER: wiadomość od end usera
        - ASSISTANT: odpowiedź bota
        - SYSTEM: wiadomość systemowa (rzadkie)

    ChatSessionResponse:
      type: object
      description: Pełna sesja chatu
      properties:
        id:
          type: string
          format: uuid
        anonymousId:
          type: string
          description: ID anonimowego end usera (z cookie / sessionStorage)
          example: "anon-7f8c-..."
        externalId:
          type: string
          nullable: true
          description: Opcjonalny ID end usera od klienta
          example: "acme-customer-123"
        startedAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
        metadata:
          type: object
          nullable: true
          description: Opcjonalne metadane od klienta (URL, IP, user agent)
          additionalProperties: true
      required:
        - id
        - anonymousId
        - startedAt
        - lastActivityAt

    ChatSessionSummary:
      type: object
      description: Lekka wersja sesji dla listy (bez metadata)
      properties:
        id:
          type: string
          format: uuid
        anonymousId:
          type: string
        externalId:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
        messageCount:
          type: integer
          description: Liczba wiadomości w sesji
      required:
        - id
        - anonymousId
        - startedAt
        - lastActivityAt
        - messageCount

    StartSessionRequest:
      type: object
      description: Opcjonalne dane przy starcie sesji
      properties:
        anonymousId:
          type: string
          description: |
            Jeśli klient ma już anonymous ID (z cookie), wysyła ten sam.
            Jeśli pusty - serwer generuje nowy.
          example: "anon-7f8c-..."
        externalId:
          type: string
          nullable: true
          description: ID end usera w systemie klienta
          example: "acme-customer-123"
        metadata:
          type: object
          additionalProperties: true
          description: Dodatkowe dane (URL strony, user agent)

    Citation:
      type: object
      description: Cytat z dokumentu - źródło użyte w odpowiedzi
      properties:
        chunkId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        documentFilename:
          type: string
          description: Nazwa dokumentu źródłowego
          example: "owu-pzu-2025.pdf"
        snippet:
          type: string
          description: Krótki fragment tekstu (max ~200 znaków)
          example: "...odszkodowanie wypłacane jest w terminie 30 dni od..."
        score:
          type: number
          format: double
          description: Similarity score (0-1)
          example: 0.87
      required:
        - chunkId
        - documentId
        - snippet
        - score

    MessageResponse:
      type: object
      description: Wiadomość w historii konwersacji
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
          example: "Czy mogę przedłużyć ubezpieczenie online?"
        sources:
          type: array
          nullable: true
          description: Cytaty (tylko dla role=ASSISTANT)
          items:
            $ref: '#/components/schemas/Citation'
        tokensUsed:
          type: integer
          nullable: true
          description: Tylko dla role=ASSISTANT
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role
        - content
        - createdAt

    SendMessageRequest:
      type: object
      description: Wiadomość użytkownika do wysłania
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: Treść wiadomości
          example: "Czy mogę przedłużyć ubezpieczenie online?"
      required:
        - content

    # SSE Event payloady (dokumentacja - nie używane bezpośrednio w response)

    MessageChunkEvent:
      type: object
      description: SSE event "chunk" - kolejny fragment tekstu odpowiedzi
      properties:
        text:
          type: string
          description: Delta tekstu (cząstka odpowiedzi do dopisania)
          example: "Tak, przedłużenie ubezpieczenia"
      required:
        - text

    MessageSourcesEvent:
      type: object
      description: SSE event "sources" - lista cytatów
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
      required:
        - sources

    MessageDoneEvent:
      type: object
      description: SSE event "done" - koniec strumienia + finalne ID i statystyki
      properties:
        messageId:
          type: string
          format: uuid
          description: ID zapisanej wiadomości ASSISTANT
        tokensUsed:
          type: integer
          description: Liczba tokenów użytych w odpowiedzi
      required:
        - messageId
        - tokensUsed

    PaginatedChatSessionResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ChatSessionSummary'
        pagination:
          $ref: '#/components/schemas/PageMetadata'
      required:
        - content
        - pagination

    PaginatedMessageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MessageResponse'
        pagination:
          $ref: '#/components/schemas/PageMetadata'
      required:
        - content
        - pagination

    # === Bot Versions ===

    ChatbotVersionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        documentCount:
          type: integer
          format: int64
      required: [id, name, status, createdAt, documentCount]

    CreateVersionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        copyFromVersionId:
          type: string
          format: uuid
          nullable: true
      required: [name]

    # === RAG Settings ===

    RagSettingsResponse:
      type: object
      properties:
        minScore:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          example: 0.3
        topK:
          type: integer
          minimum: 1
          maximum: 20
          example: 5
        temperature:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          example: 0.2
        systemPrompt:
          type: string
          nullable: true
          maxLength: 4000
      required: [minScore, topK, temperature]

    RagSettingsRequest:
      type: object
      properties:
        minScore:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
        topK:
          type: integer
          minimum: 1
          maximum: 20
        temperature:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
        systemPrompt:
          type: string
          nullable: true
          maxLength: 4000
      required: [minScore, topK, temperature]

    # === Widget ===

    WidgetSettingsResponse:
      type: object
      properties:
        accentColor:
          type: string
          example: "#7B5BFF"
        iconColor:
          type: string
          nullable: true
          description: Kolor ikonki/launchera. NULL = użyj accentColor.
          example: "#16A34A"
        iconUrl:
          type: string
          nullable: true
          description: URL własnej ikonki bota (z cache-bustingiem). NULL = ikona domyślna.
          example: "/api/widget/icon/pk_widget_live_a1b2?v=1717000000"
        position:
          type: string
          enum: [bottom-right, bottom-left]
        title:
          type: string
          example: "Asystent"
        greeting:
          type: string
        placeholder:
          type: string
        isActive:
          type: boolean
      required: [accentColor, position, title, greeting, placeholder, isActive]

    WidgetSettingsRequest:
      type: object
      properties:
        accentColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        iconColor:
          type: string
          nullable: true
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Kolor ikonki/launchera. NULL/puste = użyj accentColor.
        position:
          type: string
          enum: [bottom-right, bottom-left]
        title:
          type: string
          maxLength: 60
        greeting:
          type: string
        placeholder:
          type: string
          maxLength: 80
        isActive:
          type: boolean
      required: [accentColor, position, title, greeting, placeholder, isActive]

    WidgetAdminConfigResponse:
      type: object
      properties:
        publicKey:
          type: string
          example: "pk_widget_live_a1b2c3d4"
        settings:
          $ref: '#/components/schemas/WidgetSettingsResponse'
      required: [publicKey, settings]

    # === Analytics ===

    AnalyticsSnapshotResponse:
      type: object
      properties:
        period:
          type: string
        overview:
          $ref: '#/components/schemas/AnalyticsOverview'
        engagement:
          $ref: '#/components/schemas/AnalyticsEngagement'
        dailyTimeseries:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsDailyPoint'
        hourlyHeatmap:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsHeatmapCell'
        topQuestions:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsTopQuestion'
        versionActivity:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsVersionActivity'
        longestSessions:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsLongestSession'
      required: [period, overview, engagement, dailyTimeseries, hourlyHeatmap, topQuestions, versionActivity, longestSessions]

    AnalyticsOverview:
      type: object
      properties:
        sessions: { type: integer, format: int64 }
        sessionsDeltaPercent: { type: number, format: double }
        messages: { type: integer, format: int64 }
        messagesDeltaPercent: { type: number, format: double }
        tokens: { type: integer, format: int64 }
        tokensDeltaPercent: { type: number, format: double }
        estimatedCostUsd: { type: number, format: double }
        uniqueUsers: { type: integer, format: int64 }
        uniqueUsersDeltaPercent: { type: number, format: double }
        returningUsersPercent: { type: number, format: double }
      required: [sessions, sessionsDeltaPercent, messages, messagesDeltaPercent, tokens, tokensDeltaPercent, estimatedCostUsd, uniqueUsers, uniqueUsersDeltaPercent, returningUsersPercent]

    AnalyticsEngagement:
      type: object
      properties:
        avgMessagesPerSession: { type: number, format: double }
        previousAvgMessagesPerSession: { type: number, format: double }
        avgSessionDurationSeconds: { type: integer, format: int64 }
      required: [avgMessagesPerSession, previousAvgMessagesPerSession, avgSessionDurationSeconds]

    AnalyticsDailyPoint:
      type: object
      properties:
        date: { type: string, format: date }
        sessions: { type: integer, format: int64 }
        messages: { type: integer, format: int64 }
        tokens: { type: integer, format: int64 }
      required: [date, sessions, messages, tokens]

    AnalyticsHeatmapCell:
      type: object
      properties:
        dayOfWeek: { type: integer, description: "1=Monday ... 7=Sunday (ISO)" }
        hour: { type: integer }
        count: { type: integer, format: int64 }
      required: [dayOfWeek, hour, count]

    AnalyticsTopQuestion:
      type: object
      properties:
        content: { type: string }
        occurrences: { type: integer, format: int64 }
      required: [content, occurrences]

    AnalyticsVersionActivity:
      type: object
      properties:
        versionId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        sessionCount: { type: integer, format: int64 }
      required: [versionId, name, status, sessionCount]

    AnalyticsLongestSession:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        anonymousId: { type: string }
        messageCount: { type: integer, format: int64 }
        durationSeconds: { type: integer, format: int64 }
        tokensUsed: { type: integer, format: int64 }
        lastActivityAt: { type: string, format: date-time }
      required: [sessionId, anonymousId, messageCount, durationSeconds, tokensUsed, lastActivityAt]

    # === Admin ===

    AdminStatsResponse:
      type: object
      properties:
        documents:
          $ref: '#/components/schemas/DocumentStats'
        sessions:
          $ref: '#/components/schemas/SessionStats'
        messages:
          $ref: '#/components/schemas/MessageStats'
        tokens:
          $ref: '#/components/schemas/TokenStats'
        lastActivity:
          type: string
          format: date-time
          nullable: true
      required:
        - documents
        - sessions
        - messages
        - tokens

    DocumentStats:
      type: object
      properties:
        total:
          type: integer
          format: int64
          example: 4
        byStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            PENDING: 0
            PROCESSING: 1
            READY: 3
            FAILED: 0
      required:
        - total
        - byStatus

    SessionStats:
      type: object
      properties:
        total:
          type: integer
          format: int64
          example: 12
        today:
          type: integer
          format: int64
          example: 2
        thisWeek:
          type: integer
          format: int64
          example: 8
      required:
        - total
        - today
        - thisWeek

    MessageStats:
      type: object
      properties:
        total:
          type: integer
          format: int64
          example: 30
        today:
          type: integer
          format: int64
          example: 4
      required:
        - total
        - today

    TokenStats:
      type: object
      properties:
        total:
          type: integer
          format: int64
          example: 8472
        today:
          type: integer
          format: int64
          example: 800
        estimatedCostUsd:
          type: number
          format: double
          example: 0.004
      required:
        - total
        - today
        - estimatedCostUsd

  # ----- Parameters -----
  parameters:

    PageParam:
      name: page
      in: query
      required: false
      description: Numer strony (0-based)
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeParam:
      name: size
      in: query
      required: false
      description: Rozmiar strony
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortParam:
      name: sort
      in: query
      required: false
      description: |
        Sortowanie w formacie `field,direction` gdzie direction = `asc` lub `desc`.
        Multiple sort params możliwe dla sortowania kaskadowego.
      schema:
        type: string
        example: "createdAt,desc"

  # ----- Responses (reusable) -----
  responses:

    BadRequest:
      description: Walidacja danych wejściowych nie powiodła się
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'

    Unauthorized:
      description: Brak lub nieprawidłowy token uwierzytelnienia (post-MVP)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Forbidden:
      description: Brak uprawnień do tego zasobu
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NotFound:
      description: Zasób nie istnieje (lub należy do innego tenanta)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Conflict:
      description: Konflikt biznesowy (np. duplicate)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    PayloadTooLarge:
      description: Plik większy niż dozwolony limit (50MB)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    InternalServerError:
      description: Błąd serwera - nieprzewidziany wyjątek
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  # ----- Security (post-MVP) -----
  # securitySchemes będą dodane gdy włączymy auth.
  # Planowany scheme:
  #   BearerAuth:
  #     type: http
  #     scheme: bearer
  #     bearerFormat: JWT
  # Plus widget endpoints z osobnym scheme:
  #   WidgetKeyAuth:
  #     type: apiKey
  #     in: header
  #     name: X-Widget-Key
