<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multibot Widget · Dev</title>
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; padding: 40px; max-width: 700px; margin: 0 auto; }
      h1 { font-size: 28px; }
      p { color: #555; line-height: 1.6; }
      code { background: #f4f4f6; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Multibot Widget — strona dev</h1>
    <p>
      To jest podgląd development widgetu. Patrz w prawy dolny róg — tam siedzi
      bańka czatu. Klik otworzy okno.
    </p>
    <p>
      W produkcji widget będzie wbijany przez jeden <code>&lt;script&gt;</code>
      na cudzej stronie (np. mebelki.pl).
    </p>
    <p>
      Backend musi być uruchomiony na <code>localhost:8080</code>.
    </p>

    <script
      type="module"
      src="/src/embed.tsx"
      data-multibot-widget
      data-api-url="http://localhost:8080"
      data-color="#7B5BFF"
      data-position="bottom-right"
      data-greeting="Cześć! Jestem testowym asystentem. W czym mogę pomóc?"
      data-title="Multibot Asystent"
      data-placeholder="Napisz wiadomość…"
    ></script>
  </body>
</html>
