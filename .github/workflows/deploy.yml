name: Deploy (prod)

# Ręczny deploy na żądanie (przycisk "Run workflow" w zakładce Actions).
# NIE odpala się automatycznie na push — świadoma decyzja przy jednym hoście prod.
#
# Wymaga sekretów repo (Settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_KEY  - prywatny klucz SSH autoryzowany na serwerze (authorized_keys)
#   DEPLOY_HOST     - adres serwera (np. 178.105.248.132)
#   DEPLOY_USER     - użytkownik SSH (np. root)
# Opcjonalnie zmienna (Variables):
#   DEPLOY_HEALTH_URL - URL healthchecku po deployu (np. https://multibot-test.duckdns.org/actuator/health)
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull + rebuild na serwerze
    runs-on: ubuntu-latest
    environment: production    # umożliwia dodanie bramki "required reviewers" w Settings
    steps:
      - name: Konfiguracja SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::error::Brak sekretów DEPLOY_SSH_KEY / DEPLOY_HOST. Dodaj je w Settings -> Secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (git pull --ff-only + rebuild + czekaj na start)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'DEPLOY'
          set -e
          cd /opt/multibot
          echo "== git pull =="
          git pull --ff-only origin main
          echo "HEAD: $(git rev-parse --short HEAD)"
          echo "== rebuild backend + web =="
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
          echo "== czekam na start backendu =="
          for i in $(seq 1 60); do
            if docker logs multibot-backend 2>&1 | grep -q "Started MultibotApplication"; then
              echo "backend UP"; break
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env ps
          DEPLOY

      - name: Healthcheck (opcjonalny)
        if: ${{ vars.DEPLOY_HEALTH_URL != '' }}
        run: |
          echo "Sprawdzam ${{ vars.DEPLOY_HEALTH_URL }}"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.DEPLOY_HEALTH_URL }}" || echo 000)
            echo "  health: $code"
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "::error::Healthcheck nie zwrócił 200"
          exit 1
